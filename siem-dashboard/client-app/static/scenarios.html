<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scenario Operations · Acme Workspace</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/workspace"><span class="brand-mark">A</span><span>Acme Workspace</span><span class="environment">PRODUCTION</span></a>
      <div class="topbar-right"><span class="secure">● Secure session</span><span class="avatar">AC</span><button id="logout" class="ghost">Sign out</button></div>
    </header>
    <div class="app-layout">
      <aside class="sidebar">
        <div class="side-label">WORKSPACE</div>
        <a class="side-link" href="/workspace">Overview</a>
        <a class="side-link active" href="/scenarios">Scenario operations</a>
        <div class="side-label side-spacer">SECURITY</div>
        <div class="tenant"><small>WORKSPACE</small><strong>Acme Enterprise</strong><span>Tenant ACME-001</span></div>
      </aside>
      <main class="shell">
        <section class="welcome">
          <div><p class="eyebrow">SCENARIO OPERATIONS</p><h1>Attack scenario runner</h1><p class="muted">Run controlled playbooks against the SIEM telemetry pipeline.</p></div>
          <span class="pill danger">SOC simulation</span>
        </section>
        <section id="running-scenarios" class="scenario-section hidden">
          <h2 class="scenario-heading">Running Scenarios</h2>
          <div id="running-list" class="running-list"></div>
        </section>
        <section>
          <h2 class="scenario-heading">Available Playbooks</h2>
          <div id="playbook-list" class="playbook-grid"></div>
        </section>
        <div id="scenario-result" class="result hidden"></div>
      </main>
    </div>
    <script src="/assets/scenarios.js"></script>
